<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 

        body{
            background-color:gray; 
            overflow: hidden; 
            margin: 0px;
        } 
        canvas{
            position:absolute; 

        }

    </style>
</head>
<body> 

    <canvas id="canvas"> </canvas>
    

<script> 
    let x=100; 
    let y=100; 
    let r=20;
    let yspeed= 1; 
    let xspeed=0;  
    let g  = 0.1; 
    let vinkel= 0;  
    let canvas = document.getElementById("canvas") 
    let ctx=canvas.getContext("2d") 
    let h = window.innerHeight; 
    let w=window.innerWidth;  
    canvas.height=h; 
    canvas.width=w;

    

    function draw(){
        console.log("fun")

        ctx.fillstyle= "rgba(255,255,255,0.8)"; 
        ctx.clearRect(0,0,w,h);
        
        ctx.beginPath(); 
        ctx.moveTo(x,y); 
        ctx.arc(x,y,r,0, 2*Math.PI); 
        ctx.fill();
    } 
    draw(); 
    function update(){
        
        yspeed= yspeed+g;
        y= y+yspeed; 
        if(y>400){
            y=yspeed*-1;
        } 
        console.log(yspeed);
        
        
        draw(); 
    } 
    setInterval(update,30);

</script>
</body>
</html>
